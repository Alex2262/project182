protocol_version: 1
question: Can short-sequence pretraining produce a recurrent forecaster that keeps improving on long deployment streams?
data:
  family: ar1
  bound: 0.95
  noise_std: 0.5
  initial_value: 0.0
  parameter_prior: uniform[-bound,bound], independent per series
  tokenization: observed pair (y[t-1], y[t]); target y[t+1]
model:
  family: gated_deltanet
  width: 64
  layers: 2
  heads: 4
  key_dim: 16
  chunk_size: 64
  dtype: float32
training:
  seed: 182
  data_seed: 410000000
  regime: short
  lengths: [64, 256]
  tokens_per_step: 2048
  steps: 2000
  learning_rate: 0.0003
  optimizer: Adam
  betas: [0.9, 0.999]
  eps: 0.00000001
  weight_decay: 0.0
  schedule: constant
  grad_clip: 1.0
  log_every: 25
  checkpoint_every: 100
  validation_steps: [500, 1000, 2000]
evaluation:
  lengths: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
  batch_size: 4
  validation:
    seed: 920000000
    series: 512
  confirmation:
    seed: 940000000
    series: 1024
preflight:
  families: [gated_deltanet, transformer_nope]
  steps_per_case: 10
  gpu: A100-40GB
  cpu: 2
  memory_mib: 8192
  timeout_seconds: 300
  retries: 0
wandb:
  enabled: true
  entity: alexander-tian-ucb
  project: project182
